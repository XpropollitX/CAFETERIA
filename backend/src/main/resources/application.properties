spring.application.name=cafeteria-las-rosas

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cafeteria_las_rosas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Propollit&06}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.clean-disabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.upload-dir=${UPLOAD_DIR:uploads/product-images}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:900000}
app.jwt.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.jwt.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.initial-admin.password=${ADMIN_INITIAL_PASSWORD:}
